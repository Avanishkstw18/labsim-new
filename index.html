<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),td=()=>new Date().toISOString().slice(0,10);
let S={user:{id:'',email:'',name:'',role:''},users:[],wf:[],res:[],mt:[],ws:[],cr:[],up:[],depts:[]},V={page:'dash',authMode:'login'};
let TOKEN=localStorage.getItem('labsim_token')||'';
let sseSource=null;

async function api(url, opts={}){
  const headers={'Content-Type':'application/json',...(opts.headers||{})};
  if(TOKEN)headers['Authorization']='Bearer '+TOKEN;
  const res=await fetch(url,{...opts,headers});
  const data=await res.json().catch(()=>({}));
  if(!res.ok){
    if(res.status===401 && TOKEN){
      logout(true);
    }
    throw new Error(data.error||`Request failed (${res.status})`);
  }
  return data;
}

let _toastTimer=null;
function toast(msg,err=false){
  const el=$('#ts');if(!el)return;
  el.innerHTML=`<div class=toast><i class=dt style="background:${err?'var(--r)':'var(--g)'};margin:0"></i><span>${E(msg)}</span></div>`;
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>{if($('#ts'))$('#ts').innerHTML=''},2800);
}

async function syncState(){
  if(!TOKEN)return;
  const data=await api('/api/state');
  S=Object.assign(S,data);
  R();
}

function connectSSE(){
  if(sseSource){sseSource.close();sseSource=null}
  if(!TOKEN)return;
  sseSource=new EventSource('/api/events?token='+encodeURIComponent(TOKEN));
  const onRemoteChange=()=>syncState().catch(()=>{});
  sseSource.addEventListener('update_published',onRemoteChange);
  sseSource.addEventListener('update_changed',onRemoteChange);
  sseSource.addEventListener('workspace_sync',onRemoteChange);
}

function logout(silent=false){
  TOKEN='';
  localStorage.removeItem('labsim_token');
  if(sseSource){sseSource.close();sseSource=null}
  S={user:{id:'',email:'',name:'',role:''},users:[],wf:[],res:[],mt:[],ws:[],cr:[],up:[],depts:[]};
  if(!silent)X();
  R();
}

function showErrorModal(msg){
  $('#mo').innerHTML=`<div class=ov onclick="if(event.target==this)X()"><div class=md style="max-width:420px"><div class=mh><b>Action Failed</b><button class=x onclick="X()">&times;</button></div><p class=er style="min-height:0">${E(msg)}</p><div class=mf><button class=btn onclick="X()">Close</button></div></div></div>`;
}

async function runAction(fn,msg='Saved'){
  try{
    await fn();
    await syncState();
    if(msg)toast(msg);
  }catch(err){
    showErrorModal(err.message);
  }
}

const ROLES=['Admin / Lab In-Charge','Faculty','Lab Staff','Lab Technician','Researcher','Student'];
const canManage=()=>/admin|in-charge|faculty|staff|technician|manager|lead|supervisor/i.test(S.user.role||'');
const NAV=[['dash','Dashboard'],['wf','Workflows'],['res','Resources & Inventory'],['mt','Maintenance'],['ws','Waste Management'],['cr','Crisis Resolution'],['up','Update Centre']];

async function submitAuth(){
  const mode=V.authMode||'login';
  const isReg=mode==='register',isNewLab=mode==='create-lab';
  const labName=($('#au_lab_name')?.value||'').trim();
  const labUsername=($('#au_lab_user')?.value||'').trim();
  const labPassword=$('#au_lab_pass')?.value||'';
  const email=($('#au_email')?.value||'').trim();
  const password=$('#au_pass')?.value||'';
  const name=($('#au_name')?.value||'').trim();
  const role=($('#au_role')?.value||'').trim();
  const er=$('#au_er'),btn=$('#au_btn');
  er.textContent='';
  if(!labUsername||!labPassword||!email||!password||((isReg||isNewLab)&&!name)||(isNewLab&&!labName)){er.textContent='Please complete all required fields.';return}
  btn.disabled=true;
  try{
    const endpoint=isNewLab?'/api/auth/create-lab':isReg?'/api/auth/register':'/api/auth/login';
    const payload=isNewLab?{labName,labUsername,labPassword,name,role,email,password}:isReg?{labUsername,labPassword,name,role,email,password}:{labUsername,labPassword,email,password};
    const data=await api(endpoint,{method:'POST',body:JSON.stringify(payload)});
    TOKEN=data.token;
    localStorage.setItem('labsim_token',TOKEN);
    S=Object.assign(S,data.state);
    X();
    connectSSE();
    R();
  }catch(err){
    er.textContent=err.message;
    btn.disabled=false;
  }
}

function calEventsOn(i){
  const evs=[];
  S.wf.forEach(w=>{
    if(w.start<=i&&i<=w.end){
      const kind=w.end===i?'Workflow Deadline':w.start===i?'Workflow Start':'Active Workflow';
      evs.push({type:'wf',badge:kind,bc:w.end===i?'O':sc(w.status),title:w.name,sub:`${w.purpose} · ${w.start} → ${w.end}`,status:w.status,desc:w.guide||w.purpose,actionLabel:'Open Workflow',action:()=>go('wfd',w.id)});
    }
    w.tasks.forEach(t=>{
      if(t.due===i){
        const assignee=w.members.find(m=>m.id===t.to)?.name||'Unassigned';
        evs.push({type:'task',badge:'Task Due',bc:t.status==='Done'?'G':'P',title:t.name,sub:`Workflow: ${w.name} · Assignee: ${assignee}`,status:t.status,desc:`Due on ${fd(t.due)} · Current status: ${t.status}`,actionLabel:'Open Workflow',action:()=>go('wfd',w.id)});
      }
    });
  });
  S.mt.forEach(m=>{
    if(m.due===i){
      evs.push({type:'mt',badge:'Maintenance',bc:m.status==='Completed'?'G':'R',title:`${m.eq} (${m.type})`,sub:`Due ${fd(m.due)} · ${m.status}`,status:m.status,desc:m.desc,actionLabel:'Open Maintenance',action:()=>go('mt')});
    }
  });
  return evs;
}

    filtered=q?all.filter(c=>c.t.toLowerCase().includes(q)||c.s.toLowerCase().includes(q)):all;
    if(idx>=filtered.length)idx=0;
    $('#cmd_list').innerHTML=filtered.length?filtered.map((c,i)=>`<div class="cmd-item ${i==idx?'on':''}" onclick="X();_cmdList[${i}].fn()"><div><b>${E(c.t)}</b><div class=m>${E(c.s)}</div></div>${ic('chev',14)}</div>`).join(''):'<div class=em>No matching commands or queries.</div>';
    window._cmdList=filtered;
  };
  $('#mo').innerHTML=`<div class=ov onclick="if(event.target==this)X()"><div class=md style="max-width:560px"><div class=mh><div><b style="font-size:18px">Commands & Queries</b><div class=m>Jump to pages, run quick actions, or inspect live lab queries.</div></div><button class=x onclick="X()">&times;</button></div><div class=fi>${ic('search',16)}<input id=cmd_in placeholder="Type a command or query (e.g. delayed, maintenance, new workflow)..." value="${E(initQ)}"></div><div id=cmd_list style="max-height:340px;overflow:auto"></div></div></div>`;
  const inp=$('#cmd_in');inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);
  inp.oninput=()=>{idx=0;renderList()};
  inp.onkeydown=e=>{
    if(e.key=='ArrowDown'){e.preventDefault();if(filtered.length){idx=(idx+1)%filtered.length;renderList()}}
    else if(e.key=='ArrowUp'){e.preventDefault();if(filtered.length){idx=(idx-1+filtered.length)%filtered.length;renderList()}}
    else if(e.key=='Enter'){e.preventDefault();if(filtered[idx]){const fn=filtered[idx].fn;X();fn()}}
    else if(e.key=='Escape'){e.preventDefault();X()}
  };
  renderList();
}

function openProfileModal(){
  const roleOpts=ROLES.includes(S.user.role)?ROLES:[S.user.role,...ROLES].filter(Boolean);
  M('Profile',[{k:'name',l:'Name',r:1,p:'Your name'},{k:'role',l:'Role',t:'select',o:roleOpts}],async v=>{
    const data=await api('/api/auth/profile',{method:'PUT',body:JSON.stringify(v)});
    S.user=data.user;
  },'Save',S.user,S.user.email||'',false,`<button class="btn d" style="margin-right:auto" onclick="logout()">Sign Out</button>`);
}

const P={dash,cal,wf,wfd,res,mt,ws,cr,up,upd};
function R(){
  const ae=document.activeElement;
  const focusState=(ae&&ae.id&&$('#app')?.contains(ae)&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))?{id:ae.id,val:ae.value,s:ae.selectionStart,e:ae.selectionEnd}:null;
  const a=V.page=='wfd'?'wf':V.page=='upd'?'up':V.page,ur=S.up.filter(u=>!u.read).length,ini=S.user.name?S.user.name.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase():'?',NI={dash:'home',wf:'flow',res:'box',mt:'tool',ws:'trash',cr:'shield',up:'refresh'};
  $('#app').className=V.sb?'c':'';
  $('#app').innerHTML=`<header><button class=hb onclick="V.sb=!V.sb;R()" aria-label="Toggle navigation">${ic('menu',20)}</button><div class=lg><div class=lgi>${ic('flask',22)}</div><div><b>LabSim</b><small>Lab operations</small></div></div><div class=gs style="cursor:pointer" onclick="if(event.target.tagName!='INPUT')openCmd($('#gs').value)"><input id=gs placeholder="Search anything or run commands…" onkeydown="if(event.key=='Enter'){openCmd(this.value)}"><kbd onclick="event.stopPropagation();openCmd($('#gs').value)" style="cursor:pointer">⌘ K</kbd></div><button class=ic onclick="V.sel=td();go('cal')">${ic('cal')}</button><button class=ic onclick="bell()">${ic('bell')}${ur?`<span class=nb>${ur}</span>`:''}</button><button class=ic onclick="M('Help',[],()=>{},'Close',{},'Use the sidebar to open each section, or press ⌘K / / for Commands & Queries. All changes sync automatically with the shared PostgreSQL database.')">${ic('help')}</button><div class=pf onclick="openProfileModal()"><div class=av>${ini}</div><div><b>${E(nm())}</b><div class=m>${E(S.user.role||'Set role')}</div></div>${ic('chev',14)}</div></header><aside><div class=wl>Workspace</div>${NAV.map(([k,l])=>`<a class="${a==k?'on':''}" onclick="go('${k}')">${ic(NI[k])}<span style="flex:1">${l}</span>${k=='wf'?ic('chev',14):''}</a>`).join('')}<div class=ws><div><i class=dt></i><b>${E(S.user.lab_name||S.user.lab_username||'Simulink workspace')}</b><div class=m>${E(S.user.lab_username?'Lab ID: '+S.user.lab_username:'Live environment')}</div></div>${ic('chev',14)}</div></aside><main><section>${P[V.page]()}</section></main>`;
  if(focusState){
    const el=$('#'+focusState.id);
    if(el){el.value=focusState.val;el.focus();try{el.setSelectionRange(focusState.s,focusState.e)}catch{}}
  }
  if(!TOKEN)renderAuthGate();
}

addEventListener('keydown',e=>{
  if(!TOKEN)return;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()=='k'){e.preventDefault();openCmd($('#gs')?.value||'')}
  else if(e.key=='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();openCmd()}
});

(async function bootstrap(){
  R();
  if(TOKEN){
    try{
      await syncState();
      connectSSE();
    }catch{
      logout(true);
    }
  }
})();
</script></body></html>
